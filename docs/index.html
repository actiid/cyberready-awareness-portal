<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="CyberReady cybersecurity awareness training portal." />
    <title>CyberReady | Security Awareness Training</title>
    <style>
      :root { --navy:#0b213a; --deep:#071728; --ink:#10283f; --muted:#607586; --line:#d9e4ea; --paper:#fff; --canvas:#f2f6f8; --teal:#159b8c; --teal-soft:#dff7f2; --orange:#df7130; --orange-soft:#fff0e5; --blue:#2675b7; --blue-soft:#e6f2fb; --red:#ad3741; --red-soft:#fff0f1; }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { margin:0; background:var(--canvas); color:var(--ink); font:15px/1.6 "Segoe UI",Arial,sans-serif; }
      button,input,select,textarea { font:inherit; }
      button { cursor:pointer; }
      a { color:inherit; text-decoration:none; }
      :focus-visible { outline:3px solid #ffb64c; outline-offset:3px; }
      .shell { min-height:100vh; display:grid; grid-template-columns:260px minmax(0,1fr); }
      aside { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; overflow:auto; background:var(--deep); color:#a9bfce; }
      .brand { display:flex; align-items:center; gap:12px; padding:25px 22px; border-bottom:1px solid #243b51; }
      .shield { display:grid; place-items:center; width:42px; height:49px; clip-path:polygon(50% 0,94% 17%,88% 72%,50% 100%,12% 72%,6% 17%); background:var(--teal); color:var(--deep); font-size:21px; font-weight:900; }
      .brand b,.brand small { display:block; }
      .brand b { color:#fff; font-size:19px; }
      .brand small { color:#8da8b9; font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
      nav { display:grid; gap:4px; padding:24px 14px; }
      .nav-title { padding:0 10px 9px; color:#7592a6; font-size:10px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; }
      .nav-link { display:flex; gap:10px; align-items:center; padding:10px; border-left:3px solid transparent; border-radius:7px; font-size:13px; font-weight:650; }
      .nav-link:hover,.nav-link.active { color:#fff; background:#14324d; }
      .nav-link.active { border-left-color:var(--teal); }
      .nav-no { color:#6a8ca4; font:10px Consolas,monospace; }
      .nav-help { margin:auto 18px 18px; padding:14px; border:1px solid #294155; border-radius:9px; color:#89a2b3; font-size:11px; }
      .nav-help b { color:#fff; }
      .top { display:flex; justify-content:space-between; align-items:center; min-height:64px; padding:0 34px; border-bottom:1px solid var(--line); background:#fff; }
      .training { color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
      .pulse { display:inline-block; width:8px; height:8px; margin-right:8px; border-radius:50%; background:var(--teal); box-shadow:0 0 0 4px var(--teal-soft); }
      .badge { padding:5px 8px; border:1px solid #c9d7df; border-radius:4px; color:#587083; font:800 9px Consolas,monospace; letter-spacing:.06em; }
      main { width:min(100%,1240px); min-height:calc(100vh - 123px); margin:auto; padding:34px 36px 58px; }
      footer { display:flex; justify-content:space-between; gap:18px; margin:0 36px; padding:20px 0 28px; border-top:1px solid var(--line); color:#718490; font-size:10px; }
      .hero { position:relative; display:grid; grid-template-columns:1.2fr .8fr; overflow:hidden; min-height:360px; border-radius:22px; background:var(--navy); color:#fff; }
      .hero-copy { padding:52px; }
      .eyebrow { display:block; color:var(--teal); font-size:10px; font-weight:850; letter-spacing:.16em; text-transform:uppercase; }
      .hero .eyebrow { color:#72ded1; }
      h1 { margin:14px 0; font-size:clamp(42px,5vw,66px); letter-spacing:-.06em; line-height:.98; }
      .hero em { color:#75ded0; font-family:Georgia,serif; font-weight:500; }
      .hero p { max-width:570px; color:#c1d1dc; font-size:16px; }
      .hero-art { position:relative; overflow:hidden; background:#102c48; }
      .hero-art:before { position:absolute; inset:0; background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px); background-size:34px 34px; content:""; }
      .big-shield { position:absolute; top:50%; left:50%; display:grid; place-items:center; width:145px; height:172px; clip-path:polygon(50% 0,94% 17%,88% 72%,50% 100%,12% 72%,6% 17%); background:var(--teal); color:var(--deep); transform:translate(-50%,-50%); font-size:48px; font-weight:900; }
      .big-shield:before { position:absolute; inset:13px; border:2px solid #0b213a88; clip-path:inherit; content:""; }
      .big-shield span { z-index:1; }
      .cta,.primary { display:inline-flex; align-items:center; gap:10px; min-height:45px; padding:0 17px; border:0; border-radius:7px; background:var(--navy); color:#fff; font-size:12px; font-weight:850; }
      .cta { margin-top:18px; background:#fff; color:var(--navy); }
      .progress { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:20px; margin:18px 0 46px; padding:18px 22px; border:1px solid var(--line); border-radius:11px; background:#fff; }
      .progress strong { color:var(--teal); font:32px Georgia,serif; }
      .bar { height:7px; overflow:hidden; border-radius:8px; background:#e2e9ed; }.bar i { display:block; height:100%; background:var(--teal); }
      .local { color:#718490; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; }
      .heading { display:flex; align-items:end; justify-content:space-between; gap:30px; margin:0 0 20px; }.heading h2,.page-head h1 { margin:5px 0 0; color:var(--navy); font-size:31px; letter-spacing:-.04em; line-height:1.1; }.heading p { max-width:450px; margin:0; color:var(--muted); font-size:13px; }
      .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; }.card { --accent:var(--teal); --soft:var(--teal-soft); display:flex; min-height:235px; flex-direction:column; padding:21px; border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:10px; background:#fff; }.card.orange {--accent:var(--orange);--soft:var(--orange-soft)}.card.blue {--accent:var(--blue);--soft:var(--blue-soft)}
      .card:hover { box-shadow:0 14px 30px #0b213a16; transform:translateY(-2px); }.card-top,.card-foot { display:flex; align-items:center; justify-content:space-between; }.num { display:grid; place-items:center; width:38px; height:38px; border-radius:50%; background:var(--soft); color:var(--accent); font:800 10px Consolas,monospace; }.time { color:#718490; font-size:10px; font-weight:700; }.card h3 { margin:17px 0 6px; color:var(--navy); font-size:19px; line-height:1.2; }.card p { margin:0; color:var(--muted); font-size:12px; }.card-foot { margin-top:auto; padding-top:15px; border-top:1px solid #e5ecef; color:var(--accent); font-size:11px; font-weight:850; }
      .notice { display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; margin-top:37px; padding:25px; border-left:5px solid var(--orange); border-radius:8px; background:var(--orange-soft); }.notice .mark { display:grid; place-items:center; width:43px; height:43px; border:2px solid var(--orange); border-radius:50%; color:var(--orange); font:900 24px Georgia,serif; }.notice h2 { margin:4px 0; font-size:24px; }.notice p { margin:0; color:#715d50; font-size:12px; }
      .page-head { display:grid; grid-template-columns:auto 1fr; gap:24px; padding:5px 0 28px; margin-bottom:26px; border-bottom:1px solid #d5e0e6; }.page-no { color:#b5c5cf; font:60px Georgia,serif; line-height:.9; }.page-head p { max-width:830px; margin:9px 0; color:var(--muted); font-size:15px; }.pill { display:inline-block; padding:4px 8px; border-radius:12px; background:#eaf0f3; color:#718490; font-size:10px; font-weight:750; text-transform:uppercase; }
      .info { padding:13px 16px; border-radius:8px; background:var(--blue-soft); color:#385a70; font-size:12px; }.warning { background:var(--orange-soft); color:#745d4d; }.alert { background:var(--red-soft); color:#7d4d54; border-left:5px solid var(--red); }
      .quiz { max-width:860px; margin:25px auto 0; }.quiz-progress { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; font-weight:800; }.dots { display:flex; gap:5px; margin:8px 0 20px; }.dots i { height:4px; flex:1; border-radius:5px; background:#dfe7eb; }.dots i.on { background:var(--teal); }.message { overflow:hidden; border:1px solid #cddae2; border-radius:10px; background:#fff; box-shadow:0 8px 19px #0b213a0c; }.message-top { display:flex; justify-content:space-between; padding:11px 17px; border-bottom:1px solid var(--line); color:#577184; font-size:10px; font-weight:850; letter-spacing:.08em; text-transform:uppercase; }.message dl { padding:13px 19px 6px; margin:0; }.message div { display:grid; grid-template-columns:65px 1fr; gap:10px; margin:5px 0; }.message dt { color:#7a8a96; font-size:10px; font-weight:800; text-transform:uppercase; }.message dd { margin:0; color:#273f51; font-size:12px; font-weight:700; }.message p { margin:9px 19px 19px; padding:17px; border-left:4px solid var(--orange); background:#fff8f3; font-size:14px; }.question { margin-top:24px; }.question h2 { font-size:21px; }.answers { display:grid; gap:9px; }.answer { display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:13px; border:1px solid #c9d7df; border-radius:8px; background:#fff; text-align:left; }.answer:not(:disabled):hover { background:var(--blue-soft); border-color:var(--blue); }.letter { display:grid; place-items:center; width:27px; height:27px; border-radius:50%; background:#edf2f5; font:800 10px Consolas,monospace; }.answer.good { border-color:var(--teal); background:var(--teal-soft); }.answer.bad { border-color:var(--red); background:var(--red-soft); }.feedback { display:flex; justify-content:space-between; gap:20px; align-items:center; margin-top:15px; padding:16px; border-radius:9px; background:var(--teal-soft); }.feedback p { margin:2px 0 0; color:#4e6873; font-size:12px; }
      .grid2 { display:grid; grid-template-columns:1.1fr .9fr; gap:18px; margin-top:23px; }.panel { padding:27px; border:1px solid var(--line); border-radius:12px; background:#fff; }.panel.dark { background:var(--navy); color:#d3e0e7; }.panel h2 { margin:5px 0 10px; color:var(--navy); font-size:28px; line-height:1.15; }.panel.dark h2 { color:#fff; }.panel p { color:var(--muted); font-size:13px; }.panel.dark p { color:#a9bdca; }.field { display:flex; overflow:hidden; margin-top:8px; border:1px solid #b7c9d4; border-radius:7px; }.field input { min-width:0; flex:1; padding:12px; border:0; outline:0; }.field button { padding:0 13px; border:0; border-left:1px solid var(--line); background:#f1f5f7; color:var(--navy); font-size:11px; font-weight:800; }.secondary { margin-top:11px; padding:8px 11px; border:1px solid #b8c9d4; border-radius:6px; background:#fff; color:var(--navy); font-size:11px; font-weight:800; }.meter { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:20px; }.meter i { height:7px; border-radius:5px; background:#e0e8ec; }.checks { padding:0; list-style:none; }.checks li { margin:10px 0; color:#738490; font-size:12px; }.checks li.ok { color:var(--teal); font-weight:800; }.mini { padding-top:13px; margin-top:13px; border-top:1px solid #ffffff22; font-size:12px; }.mini b { color:#fff; }
      .complete { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-top:24px; padding:18px 21px; border:1px solid var(--line); border-radius:10px; background:#fff; }.complete p { margin:2px 0 0; color:var(--muted); font-size:11px; }.complete button { padding:10px 13px; border:1px solid var(--navy); border-radius:6px; background:#fff; color:var(--navy); font-size:11px; font-weight:850; }.complete button.done { border-color:var(--teal); background:var(--teal-soft); color:var(--teal); }
      .concept { display:grid; grid-template-columns:.8fr 1.2fr; gap:35px; align-items:center; padding:31px; border-radius:13px; background:var(--navy); color:#fff; }.concept h2 { margin:5px 0; font-size:30px; line-height:1.13; }.concept p { color:#b3c4cf; font-size:13px; }.factors { display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:8px; align-items:center; text-align:center; }.factor { padding:20px 8px; border:1px solid #ffffff33; border-radius:7px; font-size:12px; font-weight:800; }.factor small { display:block; color:#83a0b2; font:9px Consolas,monospace; }.factor.safe { border-color:var(--teal); background:#159b8c25; }.plus { color:#75ded0; font-size:21px; }.trio { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:24px; }.compare { padding:22px; border:1px solid var(--line); border-radius:10px; background:#fff; }.compare:first-child { border-top:4px solid var(--teal); }.compare h3 { color:var(--navy); margin:8px 0; }.compare p,.compare li { color:var(--muted); font-size:12px; }.compare ul { padding-left:18px; }.steps { display:grid; grid-template-columns:.8fr 1.2fr; gap:35px; margin-top:25px; padding:28px; border:1px solid var(--line); border-radius:11px; background:#fff; }.steps h2 { margin:5px 0; font-size:27px; }.steps ol { margin:0; padding-left:22px; }.steps li { margin:12px 0; color:var(--muted); font-size:12px; }.steps b { color:var(--navy); }
      .browser { overflow:hidden; border:1px solid #d2dfe6; border-radius:11px; background:#fff; }.chrome { display:flex; gap:5px; align-items:center; padding:11px; background:#dfe7eb; }.chrome i { width:8px; height:8px; border-radius:50%; background:#9aadb9; }.address { flex:1; margin-left:8px; padding:7px 10px; border-radius:6px; background:#fff; color:#435b6b; font:11px Consolas,monospace; overflow-wrap:anywhere; }.url-note { padding:23px; }.url-note b { display:block; color:var(--red); font:25px Consolas,monospace; }.url-note p { color:var(--muted); font-size:13px; }.tips { display:grid; grid-template-columns:repeat(3,1fr); gap:13px; margin-top:23px; }.tip { padding:20px; border:1px solid var(--line); border-radius:9px; background:#fff; }.tip span { color:var(--teal); font:24px Georgia,serif; }.tip h3 { margin:7px 0; color:var(--navy); font-size:16px; }.tip p { margin:0; color:var(--muted); font-size:11px; }
      .levels { display:grid; gap:10px; }.level { display:grid; grid-template-columns:220px 1fr 1.15fr; gap:20px; align-items:center; padding:18px; border:1px solid var(--line); border-left:6px solid var(--teal); border-radius:8px; background:#fff; }.level.orange { border-left-color:var(--orange); }.level.red { border-left-color:var(--red); }.level h2 { margin:0; color:var(--navy); font-size:17px; }.level small { color:var(--teal); font-weight:850; font-size:9px; letter-spacing:.1em; }.level p,.handle { margin:0; color:var(--muted); font-size:11px; }.handle { padding:10px; border-radius:6px; background:#f2f6f8; }.decision { display:grid; grid-template-columns:.7fr 1.3fr; gap:30px; margin-top:25px; padding:28px; border-radius:12px; background:var(--navy); color:#fff; }.decision h2 { margin:5px 0; font-size:27px; }.decision ol { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0; padding-left:20px; color:#c4d5df; font-size:12px; }
      .report-steps { display:grid; grid-template-columns:repeat(3,1fr); gap:13px; margin:22px 0; }.report-steps article { display:grid; grid-template-columns:auto 1fr; gap:10px; padding:18px; border:1px solid var(--line); border-radius:9px; background:#fff; }.report-steps span { color:var(--teal); font:29px Georgia,serif; }.report-steps p { margin:2px 0; color:var(--muted); font-size:11px; }.report { padding:28px; border:1px solid var(--line); border-radius:12px; background:#fff; }.formgrid { display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:16px; }.formgrid label { display:grid; gap:6px; color:#385064; font-size:10px; font-weight:850; letter-spacing:.05em; text-transform:uppercase; }.formgrid input,.formgrid select,.formgrid textarea { width:100%; padding:10px; border:1px solid #bacbd5; border-radius:6px; color:var(--ink); }.formgrid .full { grid-column:1/-1; }.check { display:flex!important; grid-template-columns:auto 1fr; align-items:start; gap:8px!important; margin-top:15px; color:var(--muted)!important; font-size:11px!important; letter-spacing:0!important; text-transform:none!important; }.check input { width:auto; }.result { margin-top:22px; padding:35px; border:1px solid var(--line); border-radius:12px; background:#fff; text-align:center; }.result .checkmark { display:grid; place-items:center; width:60px; height:60px; margin:auto; border-radius:50%; background:var(--teal-soft); color:var(--teal); font-size:31px; font-weight:900; }.result p { color:var(--muted); }.dont { margin-top:21px; padding:22px; border:1px solid #edc4c7; border-radius:10px; background:var(--red-soft); }.dont h2 { margin:0; color:#8b3038; font-size:22px; }.dont p { color:#70565a; font-size:11px; }
      @media (max-width:980px) { .shell{grid-template-columns:1fr} aside{position:relative;height:auto}.brand{padding:16px}.shell nav{display:flex;overflow:auto;padding:12px}.nav-title,.nav-help{display:none}.nav-link{white-space:nowrap}.hero{grid-template-columns:1fr}.hero-art{min-height:220px}.cards,.trio,.tips{grid-template-columns:repeat(2,1fr)}.top{padding:0 18px}main{padding:25px 18px}.level{grid-template-columns:1fr}.handle{grid-column:auto}footer{margin:0 18px} }
      @media (max-width:600px) { .badge{display:none}.hero-copy{padding:33px 23px}.hero h1{font-size:43px}.progress,.heading,.complete,.feedback{grid-template-columns:1fr;display:grid}.cards,.trio,.tips,.grid2,.concept,.steps,.decision,.report-steps,.formgrid{grid-template-columns:1fr}.page-head{grid-template-columns:1fr;gap:7px}.factors{grid-template-columns:1fr}.plus{text-align:center}.decision ol{grid-template-columns:1fr}.level{gap:10px}.top{min-height:52px}.training{font-size:9px} }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const lessons = [
        {id:'phishing',no:'01',title:'Phishing Quiz',tag:'Spot the bait',time:'5 min',tone:'orange',desc:'Practice identifying suspicious messages before they reach an agency network.'},
        {id:'passwords',no:'02',title:'Password Strength Checker',tag:'Build a better lock',time:'4 min',tone:'',desc:'Test a made-up example and learn what makes a passphrase resilient.'},
        {id:'mfa',no:'03',title:'MFA Guide',tag:'Add another layer',time:'6 min',tone:'blue',desc:'Understand authentication factors, passkeys, security keys, and safer backups.'},
        {id:'browsing',no:'04',title:'Secure Browsing Tips',tag:'Navigate with care',time:'5 min',tone:'blue',desc:'Use browsers, downloads, links, and public Wi-Fi without taking needless risks.'},
        {id:'data',no:'05',title:'Data Classification',tag:'Handle with purpose',time:'7 min',tone:'orange',desc:'Choose safe storage and sharing habits for public, internal, CUI, and classified data.'},
        {id:'incident',no:'06',title:'Report a Security Incident',tag:'Raise the flag fast',time:'5 min',tone:'',desc:'Rehearse what to capture, what not to do, and how to notify the right team.'}
      ];
      const store = 'cyberready-completed-modules';
      let completed = JSON.parse(localStorage.getItem(store) || '[]');
      let qIndex = 0, qSelected = null, qScore = 0, qFinished = false, showPassword = false;
      const questions = [
        {from:'IT Support <helpdesk@agency-support.example>',subject:'URGENT: Your mailbox will be removed in 30 minutes',message:'Keep your account active by signing in through the secure link below.',prompt:'What is the safest first action?',choices:['Click the link and check whether the sign-in page looks real','Reply and ask the sender if the warning is legitimate','Use a known help-desk channel to verify the message'],correct:2,why:'Urgency and a lookalike support domain are warning signs. Verify through a phone number, portal, or contact you already trust—not through the message.'},
        {from:'Pat (Division Director)',subject:'Quick favor before the meeting',message:'I cannot take a call. Buy four gift cards and send me the codes right away. Keep this confidential.',prompt:'Which clue is most important?',choices:['The message is short','It requests secrecy, speed, and an unusual purchase','The director says they are in a meeting'],correct:1,why:'Attackers combine authority, urgency, secrecy, and an unusual payment request. Verify the person using a separate, approved channel.'},
        {from:'+1 (202) 555-0147',subject:'MFA reset notice',message:'Your token expires today. Reply with the six-digit code you just received so security can reactivate it.',prompt:'Why should this be reported?',choices:['Security teams never use text messages','One-time codes are authentication secrets and should not be shared','Six-digit codes are no longer used'],correct:1,why:'A legitimate support person should not ask for your password, MFA code, or recovery code. Treat these as secrets and report the request.'},
        {from:'Benefits Team <benefits@agency.gov.example>',subject:'Updated leave policy',message:'The attached file is named Leave-Policy.pdf.exe. Open it today and acknowledge the new policy.',prompt:'What makes the attachment dangerous?',choices:['The filename contains a hyphen','The message discusses a policy','The final extension is .exe, which can run a program'],correct:2,why:'Attackers hide executable files behind familiar-looking names. The final extension matters. Do not open it; report it through the approved channel.'}
      ];
      const app = document.getElementById('app');
      const route = () => location.hash.replace('#','') || 'home';
      const link = id => `#${id}`;
      const save = () => { localStorage.setItem(store, JSON.stringify(completed)); };
      const done = id => completed.includes(id);
      function toggle(id) { completed = done(id) ? completed.filter(x=>x!==id) : [...completed,id]; save(); render(); }
      function shell(content) { const r=route(); return `<div class="shell"><aside><a class="brand" href="#home"><span class="shield">✓</span><span><b>CyberReady</b><small>Awareness Center</small></span></a><nav><span class="nav-title">Learning center</span><a class="nav-link ${r==='home'?'active':''}" href="#home"><span class="nav-no">00</span>Dashboard</a>${lessons.map(x=>`<a class="nav-link ${r===x.id?'active':''}" href="#${x.id}"><span class="nav-no">${x.no}</span>${x.title}</a>`).join('')}</nav><div class="nav-help"><b>Need real help?</b><br>Use your organization’s approved service desk or SOC channel.</div></aside><div><header class="top"><span class="training"><i class="pulse"></i>Fictional training environment</span><span class="badge">UNCLASSIFIED // TRAINING</span></header><main>${content}</main><footer><span>CyberReady is a fictional awareness portal. Do not enter real credentials, CUI, or classified information.</span><span>Training build 1.0</span></footer></div></div>`; }
      function home() { const percent=Math.round(completed.length/lessons.length*100); const next=lessons.find(x=>!done(x.id))||lessons[0]; return `<section class="hero"><div class="hero-copy"><span class="eyebrow">Security starts with one good decision</span><h1>Small habits.<br><em>Stronger systems.</em></h1><p>Practical, plain-language cybersecurity training for people protecting public systems and data.</p><a class="cta" href="#${next.id}">${completed.length?'Continue training':'Start your first lesson'} <span>→</span></a></div><div class="hero-art"><div class="big-shield"><span>✓</span></div></div></section><section class="progress"><strong>${percent}%</strong><div><b>Your training progress</b><br><small>${completed.length} of ${lessons.length} lessons completed on this device</small><div class="bar"><i style="width:${percent}%"></i></div></div><span class="local">Saved only in this browser</span></section><section><div class="heading"><div><span class="eyebrow">Your learning path</span><h2>Choose a quick lesson</h2></div><p>Start anywhere. Each lesson uses realistic, fictional scenarios and avoids jargon.</p></div><div class="cards">${lessons.map(x=>`<a class="card ${x.tone}" href="#${x.id}"><div class="card-top"><span class="num">${x.no}</span><span class="time">${x.time}</span></div><span class="eyebrow" style="margin-top:16px;color:var(--accent)">${x.tag}</span><h3>${x.title}</h3><p>${x.desc}</p><div class="card-foot"><span>${done(x.id)?'✓ Completed':'Start lesson'}</span><span>↗</span></div></a>`).join('')}</div></section><section class="notice"><span class="mark">!</span><div><span class="eyebrow" style="color:var(--orange)">Remember</span><h2>Fast reporting beats perfect reporting.</h2><p>If something feels wrong, stop interacting, preserve what you can, and contact your approved security channel.</p></div></section>`; }
      const intro=(no,tag,title,copy,time)=>`<header class="page-head"><div class="page-no">${no}</div><div><span class="eyebrow">${tag}</span><h1>${title}</h1><p>${copy}</p><span class="pill">About ${time}</span></div></header>`;
      const complete=id=>`<section class="complete"><div><b>${done(id)?'Lesson completed':'Finished with this lesson?'}</b><p>Progress is saved only in this browser.</p></div><button class="${done(id)?'done':''}" data-complete="${id}">${done(id)?'✓ Completed':'Mark lesson complete'}</button></section>`;
      function phishing() { if(qFinished) return intro('01','Spot the bait','Phishing Quiz','Read each fictional message, notice how it tries to influence you, and choose the safest response.','5 minutes')+`<section class="result"><div class="checkmark">✓</div><span class="eyebrow">Quiz complete</span><h2>${qScore===questions.length?'Excellent threat spotting.':'Every review makes you safer.'}</h2><p>You scored ${qScore} out of ${questions.length}. Pause when a message creates urgency, asks for secrets, or pushes you outside the normal process.</p><button class="primary" id="restart">Try the quiz again</button></section>`; const q=questions[qIndex]; return intro('01','Spot the bait','Phishing Quiz','Read each fictional message, notice how it tries to influence you, and choose the safest response.','5 minutes')+`<div class="info"><b>Training only:</b> all names, domains, phone numbers, and messages below are fictional.</div><section class="quiz"><div class="quiz-progress"><span>Scenario ${qIndex+1}</span><span>${questions.length} total</span></div><div class="dots">${questions.map((_,i)=>`<i class="${i<=qIndex?'on':''}"></i>`).join('')}</div><article class="message"><div class="message-top"><span>Email / message</span><span>Simulated message</span></div><dl><div><dt>From</dt><dd>${q.from}</dd></div><div><dt>Subject</dt><dd>${q.subject}</dd></div></dl><p>${q.message}</p></article><section class="question"><h2>${q.prompt}</h2><div class="answers">${q.choices.map((c,i)=>`<button class="answer ${qSelected!==null&&i===q.correct?'good':''} ${qSelected===i&&i!==q.correct?'bad':''}" data-answer="${i}" ${qSelected!==null?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${c}</span>${qSelected!==null&&i===q.correct?'<b>Correct</b>':''}</button>`).join('')}</div></section>${qSelected!==null?`<section class="feedback"><div><b>${qSelected===q.correct?'Good call.':'Take another look.'}</b><p>${q.why}</p></div><button class="primary" id="next">${qIndex===questions.length-1?'See results':'Next scenario'} →</button></section>`:''}</section>`; }
      function passwords() { return intro('02','Build a better lock','Password Strength Checker','Explore what makes a password stronger. This checker runs entirely in your browser and never sends or saves what you type.','4 minutes')+`<div class="info warning"><b>Never enter a real password here—or in any training tool.</b> Use a made-up example that is not connected to an account.</div><section class="grid2"><div class="panel"><label for="pw"><b>Made-up password or passphrase</b></label><div class="field"><input id="pw" type="${showPassword?'text':'password'}" autocomplete="off" placeholder="Try a fictional example…"><button id="show">${showPassword?'Hide':'Show'}</button></div><button class="secondary" id="example">Generate a learning example</button><div id="strength"></div></div><aside class="panel dark"><span class="eyebrow" style="color:#72ded1">The bigger idea</span><h2>Length and uniqueness beat clever substitutions.</h2><p>A long random passphrase with several unrelated words is easier to remember and harder to guess than a short password with predictable swaps.</p><div class="mini"><b>1. Use a password manager</b><br>Let an approved manager create a different password for every account.</div><div class="mini"><b>2. Turn on MFA</b><br>A second factor reduces the damage if a password is stolen.</div><div class="mini"><b>3. Follow agency policy</b><br>Approved tools and password rules always take priority.</div></aside></section>${complete('passwords')}`; }
      function mfa() { return intro('03','Add another layer','MFA Guide','Multi-factor authentication asks for two different kinds of proof, so a stolen password alone is not enough.','6 minutes')+`<section class="concept"><div><span class="eyebrow" style="color:#72ded1">Simple definition</span><h2>Something you know + something you have or are.</h2><p>A password is something you know. A security key or managed phone is something you have. A fingerprint or face scan is something you are.</p></div><div class="factors"><div class="factor"><small>KNOW</small>Password</div><b class="plus">+</b><div class="factor"><small>HAVE</small>Security key</div><b class="plus">=</b><div class="factor safe"><small>RESULT</small>Stronger sign-in</div></div></section><section class="trio"><article class="compare"><span class="eyebrow">Best protection</span><h3>Passkey or security key</h3><p>Designed to resist fake sign-in pages because it checks the real website before approving access.</p><ul><li>Strong phishing resistance</li><li>Fast sign-in</li><li>Use agency-issued options</li></ul></article><article class="compare"><span class="eyebrow">Good</span><h3>Authenticator app</h3><p>Creates time-based codes or approval prompts on a managed device.</p><ul><li>Safer than SMS</li><li>Never share the code</li><li>Reject unexpected prompts</li></ul></article><article class="compare"><span class="eyebrow">Fallback</span><h3>SMS or voice code</h3><p>Better than a password alone, but vulnerable to phone-number takeover.</p><ul><li>Use only if policy allows</li><li>Protect mobile account</li><li>Use stronger methods when available</li></ul></article></section><section class="steps"><div><span class="eyebrow">When a prompt appears</span><h2>Stop unexpected MFA fatigue.</h2><p>Attackers may send repeated approval prompts hoping you accept one just to make them stop.</p></div><ol><li><b>Deny the prompt.</b> Do not approve a sign-in you did not start.</li><li><b>Stop and verify.</b> Open the service from a trusted bookmark.</li><li><b>Report it.</b> Notify your approved security channel.</li></ol></section>${complete('mfa')}`; }
      function browsing() { const tips=[['01','Start from a trusted path','Use a known bookmark, approved portal, or manually typed address for important systems.'],['02','Read the whole domain','A padlock means encryption; it does not prove a site is honest.'],['03','Treat downloads as code','Download only from approved sources and let security tools scan first.'],['04','Update and restart','A pending restart can mean a security fix is not active yet.'],['05','Separate work and personal use','Use managed work profiles, extensions, and storage.'],['06','Use approved remote access','Use the agency VPN or zero-trust method on public Wi-Fi.']]; return intro('04','Navigate with care','Secure Browsing Tips','A secure browser cannot make every website safe. Your choices still decide what opens, downloads, and leaves the network.','5 minutes')+`<section class="browser"><div class="chrome"><i></i><i></i><i></i><div class="address">https://login.agency.gov.example.security-check.example/</div></div><div class="url-note"><span class="eyebrow" style="color:var(--red)">Actual domain</span><b>security-check.example</b><p>The words “agency.gov” appear inside the address, but they are not the real domain. Read from the first slash backward and identify the registered domain.</p></div></section><section class="tips">${tips.map(t=>`<article class="tip"><span>${t[0]}</span><h3>${t[1]}</h3><p>${t[2]}</p></article>`).join('')}</section>${complete('browsing')}`; }
      function data() { return intro('05','Handle with purpose','Data Classification','Classification tells you how information may be stored, shared, discussed, and destroyed. When in doubt, pause and ask the data owner or security office.','7 minutes')+`<div class="info warning"><b>Policy comes first.</b> Labels and handling rules vary by organization. This is a general orientation, not a replacement for agency guidance.</div><section class="levels" style="margin-top:20px"><article class="level"><div><small>LEVEL 1</small><h2>Public</h2></div><p>Approved for public release, such as published reports or public website content.</p><p class="handle"><b>Handle:</b> Confirm release approval and protect official copies from unauthorized changes.</p></article><article class="level"><div><small>LEVEL 2</small><h2>Internal / agency use</h2></div><p>Routine operational information not intended for public distribution.</p><p class="handle"><b>Handle:</b> Use approved accounts, devices, storage, and need-to-know sharing.</p></article><article class="level orange"><div><small style="color:var(--orange)">LEVEL 3</small><h2>Controlled Unclassified Information</h2></div><p>Unclassified information that requires safeguarding or dissemination controls under law, regulation, or policy.</p><p class="handle"><b>Handle:</b> Follow markings, approved encrypted systems, access controls, and authorized recipients.</p></article><article class="level red"><div><small style="color:var(--red)">SPECIAL HANDLING</small><h2>Classified</h2></div><p>National security information formally classified at an authorized level.</p><p class="handle"><b>Handle:</b> Only in accredited spaces and systems by cleared people with verified need to know.</p></article></section><section class="decision"><div><span class="eyebrow" style="color:#72ded1">Before you share</span><h2>Ask four questions.</h2></div><ol><li>What is the official label or handling rule?</li><li>Does the recipient have authorization and need to know?</li><li>Is this device, system, and channel approved?</li><li>Are markings, encryption, and records requirements satisfied?</li></ol></section>${complete('data')}`; }
      function incident() { return intro('06','Raise the flag fast','Report a Security Incident','Practice giving a security team enough information to act quickly—without investigating, deleting evidence, or spreading sensitive details.','5 minutes')+`<div class="info alert"><b>This form is a simulation. It does not contact anyone.</b> For a real event, use your agency’s approved incident hotline, service desk, SOC, or emergency procedure.</div><section class="report-steps"><article><span>1</span><div><b>Stop</b><p>Pause clicks, replies, downloads, and logins. Follow policy before disconnecting equipment.</p></div></article><article><span>2</span><div><b>Preserve</b><p>Note the time, device, message, sender, and what happened. Do not delete evidence.</p></div></article><article><span>3</span><div><b>Report</b><p>Use a known approved channel. Share facts, not guesses.</p></div></article></section><form class="report" id="report"><span class="eyebrow">Practice form</span><h2 style="margin:4px 0;color:var(--navy)">Fictional incident report</h2><div class="formgrid"><label>Incident type<select required><option value="">Select a scenario</option><option>Suspicious email or message</option><option>Unexpected MFA prompt</option><option>Lost or stolen device</option><option>Malware or unusual behavior</option><option>Possible data exposure</option></select></label><label>When noticed?<select required><option value="">Choose time</option><option>Within 15 minutes</option><option>Within an hour</option><option>Earlier today</option><option>Unknown</option></select></label><label>Affected training asset<input required placeholder="Example: laptop TRAIN-042"></label><label>Current status<select required><option value="">Choose one</option><option>I stopped interacting</option><option>Activity may still be happening</option><option>Device is lost or unavailable</option></select></label><label class="full">What happened?<textarea required rows="5" placeholder="Use fictional facts only. Do not include passwords, real personal data, CUI, or classified information."></textarea></label></div><label class="check"><input required type="checkbox">I understand this is a local training simulation and not a real incident report.</label><button class="primary" type="submit">Submit practice report →</button></form><section class="dont"><h2>Do not make the incident harder to investigate.</h2><p><b>Do not</b> forward suspicious messages widely, run your own cleanup, contact a suspected attacker, or put sensitive content in unapproved tickets.</p></section>`; }
      function render() { const r=route(); const content={home,phishing,passwords,mfa,browsing,data,incident}[r]||home; app.innerHTML=shell(content()); bind(); }
      function bind() { document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>toggle(b.dataset.complete)); document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{qSelected=Number(b.dataset.answer); if(qSelected===questions[qIndex].correct) qScore++; render();}); const next=document.getElementById('next'); if(next) next.onclick=()=>{if(qIndex===questions.length-1){qFinished=true; if(!done('phishing')){completed.push('phishing');save();}}else{qIndex++;qSelected=null;}render();}; const restart=document.getElementById('restart'); if(restart) restart.onclick=()=>{qIndex=0;qSelected=null;qScore=0;qFinished=false;render();}; const show=document.getElementById('show'); if(show) show.onclick=()=>{showPassword=!showPassword; const v=document.getElementById('pw').value; render(); document.getElementById('pw').value=v; updateStrength();}; const ex=document.getElementById('example'); if(ex) ex.onclick=()=>{document.getElementById('pw').value='cedar-orbit-lantern-harbor-42!';updateStrength();}; const pw=document.getElementById('pw'); if(pw) pw.oninput=updateStrength; const form=document.getElementById('report'); if(form) form.onsubmit=e=>{e.preventDefault(); if(!done('incident')){completed.push('incident');save();} form.outerHTML='<section class="result"><div class="checkmark">✓</div><span class="eyebrow">Simulation complete</span><h2>Practice report organized for triage.</h2><p>Nothing was transmitted or saved. In a real event, stay available and follow the responder’s instructions.</p><span class="pill">TRAINING-2026-'+Math.floor(1000+Math.random()*9000)+'</span></section>';}; }
      function updateStrength() { const pw=document.getElementById('pw'); const target=document.getElementById('strength'); if(!pw||!target)return; const v=pw.value; const checks=[v.length>=16,/[a-z]/.test(v)&&(/[A-Z]/.test(v)||/\d/.test(v)||/[^A-Za-z0-9]/.test(v)),v&&!/(1234|qwerty|abcd|password|letmein)/i.test(v),v&&!/^(.)\1+$/.test(v)]; const n=checks.filter(Boolean).length; const labels=['Waiting for an example','Weak','Developing','Strong','Very strong']; const colors=['#e0e8ec','#ad3741','#df7130','#2675b7','#159b8c']; target.innerHTML='<div style="display:flex;justify-content:space-between;margin-top:24px;font-size:12px"><span>Example strength</span><b>'+labels[n]+'</b></div><div class="meter">'+[0,1,2,3].map(i=>'<i style="background:'+(i<n?colors[n]:'#e0e8ec')+'"></i>').join('')+'</div><ul class="checks">'+['At least 16 characters','Uses several words or character types','Avoids obvious sequences','Not built from one repeated character'].map((x,i)=>'<li class="'+(checks[i]?'ok':'')+'">'+(checks[i]?'✓':'○')+' '+x+'</li>').join('')+'</ul>'; }
      window.addEventListener('hashchange',render); render();
    </script>
  </body>
</html>
